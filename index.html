<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kafalah Dai 2026</title>
    <!-- Modern Fonts & Frameworks -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --bg-color: #f4f7fb;
            --surface: #ffffff;
            /* Tema Warna Biru Modern */
            --primary: #2563EB;
            --primary-gradient: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: rgba(203, 213, 225, 0.6);
            
            /* Status Colors (Soft) */
            --sisa-green: #10b981;
            --sisa-blue: #3b82f6;
            --sisa-red: #ef4444;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            padding-bottom: 90px;
            -webkit-font-smoothing: antialiased;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: var(--surface);
            border-radius: 24px;
            box-shadow: 0 10px 40px -10px rgba(37, 99, 235, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            padding: 24px;
            margin-bottom: 24px;
        }
        
        /* Typography & Gradients */
        .gradient-text {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        /* Navigation */
        .top-nav { display: none; }
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around;
            padding: 12px 10px 24px 10px; z-index: 1000;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-muted); cursor: pointer; transition: all 0.3s;
            padding: 8px 16px; border-radius: 16px;
        }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; }
        .nav-item span { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .nav-item.active { background: var(--primary-gradient); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25); }

        @media (min-width: 768px) {
            .bottom-nav { display: none; }
            .top-nav {
                display: flex; background: rgba(255,255,255,0.95); backdrop-filter: blur(15px);
                box-shadow: 0 4px 20px rgba(0,0,0,0.03); margin-bottom: 30px; position: sticky; top: 0; z-index: 1000;
            }
            body { padding-bottom: 0; }
        }

        /* Form Inputs & Buttons */
        .form-control, .form-select {
            border-radius: 14px; border: 1px solid var(--border-color);
            padding: 14px 16px; font-weight: 500; background: #f8fafc;
            transition: all 0.2s;
        }
        .form-control:focus, .form-select:focus {
            background: #fff; border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .btn-modern {
            background: var(--primary-gradient); border: none;
            color: white; border-radius: 14px; padding: 14px 24px;
            font-weight: 700; letter-spacing: 0.5px; transition: all 0.3s;
        }
        .btn-modern:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3); color: white; }
        
        /* Table Rekap Styling (Modern) */
        .table-modern { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .table-modern th { 
            background: transparent; color: var(--text-muted); 
            font-weight: 700; text-transform: uppercase; font-size: 0.75rem; 
            letter-spacing: 1px; padding: 0 16px 8px 16px; border: none;
        }
        .table-modern td {
            background: #ffffff; padding: 18px 16px; border: none;
            vertical-align: middle; border-top: 1px solid #f1f5f9; border-bottom: 1px solid #f1f5f9;
        }
        .table-modern tr td:first-child { border-radius: 16px 0 0 16px; border-left: 1px solid #f1f5f9; }
        .table-modern tr td:last-child { border-radius: 0 16px 16px 0; border-right: 1px solid #f1f5f9; }
        .table-modern tbody tr { box-shadow: 0 2px 5px rgba(0,0,0,0.01); transition: transform 0.2s; }
        .table-modern tbody tr:hover { transform: scale(1.01); box-shadow: 0 8px 20px rgba(0,0,0,0.04); z-index: 1; position: relative; }

        /* Status Badges (Sisa Kebutuhan) */
        .status-badge {
            padding: 8px 16px; border-radius: 10px; font-weight: 800; font-size: 0.9rem; display: inline-block;
        }
        .status-green { background: var(--sisa-green); color: white; box-shadow: 0 4px 10px rgba(16,185,129,0.3); }
        .status-blue { background: var(--sisa-blue); color: white; box-shadow: 0 4px 10px rgba(59,130,246,0.3); }
        .status-red { background: var(--sisa-red); color: white; box-shadow: 0 4px 10px rgba(239,68,68,0.3); }

        /* Loader & Animations */
        .tab-content-area { display: none; animation: fadeIn 0.4s ease; }
        .tab-content-area.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- Desktop Nav -->
    <nav class="navbar navbar-expand-lg top-nav py-3">
        <div class="container">
            <a class="navbar-brand fs-4 fw-bolder" href="#">
                <i class="bi bi-layers-half text-primary"></i> 
                <span class="gradient-text ms-1">Kafalah Dai</span>
            </a>
            <div class="d-flex ms-auto gap-3">
                <button class="btn btn-light rounded-pill px-4 fw-bold" onclick="trySwitchTab('rekap')">Rekap</button>
                <button class="btn btn-light rounded-pill px-4 fw-bold" onclick="trySwitchTab('riwayat')">Riwayat</button>
                <button class="btn btn-modern rounded-pill px-4" onclick="trySwitchTab('input')"><i class="bi bi-plus-lg me-1"></i> Input Data</button>
            </div>
        </div>
    </nav>

    <div class="container mt-3 mb-5 pb-5">
        
        <!-- =================== TAB REKAP =================== -->
        <div id="tab-rekap" class="tab-content-area active">
            <!-- Filter Date Range -->
            <div class="glass-card mb-4 p-3 p-md-4">
                <div class="row g-3 align-items-end">
                    <div class="col-6 col-md-5">
                        <label class="form-label text-muted fw-bold small text-uppercase">Mulai Bulan</label>
                        <input type="month" id="filterStart" class="form-control fw-bold" onchange="renderDashboard()">
                    </div>
                    <div class="col-6 col-md-5">
                        <label class="form-label text-muted fw-bold small text-uppercase">Sampai Bulan</label>
                        <input type="month" id="filterEnd" class="form-control fw-bold" onchange="renderDashboard()">
                    </div>
                    <div class="col-12 col-md-2">
                        <button class="btn btn-modern w-100" onclick="renderDashboard()">
                            <i class="bi bi-funnel-fill"></i> Filter
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabel Rekap -->
            <div class="glass-card table-responsive p-4">
                <h5 class="fw-bold mb-4 text-main"><i class="bi bi-table text-primary me-2"></i>Tabel Rekapitulasi</h5>
                <table class="table-modern">
                    <thead>
                        <tr>
                            <th width="5%">No</th>
                            <th width="15%">Bulan</th>
                            <th width="10%" class="text-center">Jml Dai</th>
                            <th width="20%" class="text-end">Kebutuhan Dana</th>
                            <th width="20%" class="text-end">Dana Masuk</th>
                            <th width="30%" class="text-end">Sisa Kebutuhan</th>
                        </tr>
                    </thead>
                    <tbody id="rekapTableBody">
                        <!-- Disuntikkan lewat JS -->
                    </tbody>
                    <tfoot>
                        <tr><td colspan="6"><hr class="text-muted opacity-25"></td></tr>
                        <tr class="fw-bolder fs-5 bg-light rounded-4">
                            <td colspan="3" class="text-end text-muted p-3 rounded-start-4">TOTAL KESELURUHAN</td>
                            <td class="text-end text-danger p-3" id="totKebutuhan">Rp 0</td>
                            <td class="text-end text-primary p-3" id="totMasuk">Rp 0</td>
                            <td class="text-end p-3 rounded-end-4" id="totSisa">Rp 0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <!-- Grafik Visual -->
            <div class="glass-card mt-4 p-4">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                    <h5 class="fw-bold m-0 text-main"><i class="bi bi-bar-chart-fill text-primary me-2"></i>Grafik Arus Dana</h5>
                    <select id="chartFilter" class="form-select w-auto fw-bold" onchange="renderDashboard()">
                        <option value="all">Kebutuhan dan Dana Masuk</option>
                        <option value="kebutuhan">Kebutuhan</option>
                        <option value="pemasukan">Dana Masuk</option>
                        <option value="dai">Jumlah Dai</option>
                    </select>
                </div>
                <div style="height: 350px;">
                    <canvas id="financeChart"></canvas>
                </div>
            </div>
        </div>

        <!-- =================== TAB RIWAYAT =================== -->
        <div id="tab-riwayat" class="tab-content-area">
            <div class="glass-card p-4">
                <h4 class="fw-bold mb-4 gradient-text">Riwayat Transaksi</h4>
                <div class="table-responsive">
                    <table class="table-modern w-100 align-middle">
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Tipe</th>
                                <th>Detail (Sumber/Dai)</th>
                                <th class="text-end">Nominal</th>
                                <th class="text-center">Bukti</th>
                                <th class="text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- =================== TAB INPUT DATA =================== -->
        <div id="tab-input" class="tab-content-area">
            <div class="glass-card p-4" style="max-width: 700px; margin: 0 auto;">
                <h4 class="fw-bold mb-4 gradient-text text-center" id="formTitle">Manajemen Data</h4>
                
                <ul class="nav nav-pills nav-fill mb-4 p-2 bg-light rounded-4 border" id="pills-tab" role="tablist">
                  <li class="nav-item-form me-2 flex-fill" role="presentation">
                    <button class="nav-link active w-100 rounded-3 fw-bold py-3" data-bs-toggle="pill" data-bs-target="#pills-masuk" type="button" id="tab-btn-masuk">
                        <i class="bi bi-box-arrow-in-down"></i> Input Dana Masuk
                    </button>
                  </li>
                  <li class="nav-item-form flex-fill" role="presentation">
                    <button class="nav-link w-100 rounded-3 fw-bold py-3" data-bs-toggle="pill" data-bs-target="#pills-kebutuhan" type="button" id="tab-btn-kebutuhan">
                        <i class="bi bi-calculator"></i> Input Kebutuhan Dana
                    </button>
                  </li>
                </ul>

                <div class="tab-content mt-2" id="pills-tabContent">
                    
                    <!-- FORM: DANA MASUK -->
                    <div class="tab-pane fade show active" id="pills-masuk" role="tabpanel">
                        <form id="formPemasukan" onsubmit="submitForm(event, 'Pemasukan')">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Sumber Dana</label>
                                    <input type="text" class="form-control" name="keterangan" value="WIZ" placeholder="Contoh: WIZ, Donatur..." required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Tanggal Masuk</label>
                                    <input type="date" class="form-control" name="tanggal" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-bold">Nominal Masuk (Rp)</label>
                                    <input type="text" inputmode="numeric" class="form-control fs-4 fw-bold text-primary" name="nominal" placeholder="0" required oninput="formatCurrency(this)">
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-bold">Upload Bukti Transfer (Opsional)</label>
                                    <input type="file" class="form-control" name="file" accept="image/*">
                                    <small class="text-muted d-none mt-1" id="editFileHintMasuk">Abaikan jika tidak mengubah bukti gambar.</small>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-modern w-100 mt-4 btn-submit">Simpan Dana Masuk</button>
                            <button type="button" class="btn btn-light w-100 mt-2 btn-cancel fw-bold text-danger" style="display:none" onclick="cancelEdit()">Batal Edit</button>
                        </form>
                    </div>

                    <!-- FORM: KEBUTUHAN -->
                    <div class="tab-pane fade" id="pills-kebutuhan" role="tabpanel">
                        <form id="formKebutuhan" onsubmit="submitForm(event, 'Kebutuhan')">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Bulan & Tahun</label>
                                    <input type="month" class="form-control" name="tanggal" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small fw-bold">Jumlah Dai</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" name="keterangan" placeholder="Contoh: 300" required>
                                        <span class="input-group-text border-0 bg-light fw-bold text-muted">Orang</span>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label text-muted small fw-bold">Total Nominal Kafalah (Rp)</label>
                                    <input type="text" inputmode="numeric" class="form-control fs-4 fw-bold text-primary" name="nominal" placeholder="0" required oninput="formatCurrency(this)">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-modern w-100 mt-4 btn-submit">Simpan Kebutuhan Kafalah</button>
                            <button type="button" class="btn btn-light w-100 mt-2 btn-cancel fw-bold text-danger" style="display:none" onclick="cancelEdit()">Batal Edit</button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Nav -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="trySwitchTab('rekap')" id="nav-rekap">
            <i class="bi bi-grid-fill"></i><span>Rekap</span>
        </div>
        <div class="nav-item" onclick="trySwitchTab('riwayat')" id="nav-riwayat">
            <i class="bi bi-clock-history"></i><span>Riwayat</span>
        </div>
        <div class="nav-item" onclick="trySwitchTab('input')" id="nav-input">
            <i class="bi bi-plus-circle-fill"></i><span>Input</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // ==========================================
        // KONFIGURASI API (WAJIB DIISI)
        // ==========================================
        const GAS_API_URL = ''; // MASUKKAN URL APP SCRIPT ANDA DISINI

        // Global State
        let db = [];
        let chartInstance = null;
        let isAuthenticated = false; // Kunci tab admin (Kode: lajnah)
        let editId = null;

        const Toast = Swal.mixin({
            toast: true, position: 'top-end', showConfirmButton: false, timer: 2500, timerProgressBar: true
        });

        // Inisialisasi Aplikasi (Tanpa layar loading penuh)
        document.addEventListener("DOMContentLoaded", () => {
            setDefaultDates();
            
            // Set Filter: Jan 2026 s/d Bulan Saat Ini
            const now = new Date();
            let mm = String(now.getMonth() + 1).padStart(2, '0');
            document.getElementById('filterStart').value = `2026-01`;
            document.getElementById('filterEnd').value = `${now.getFullYear()}-${mm}`;

            loadData();
        });

        // Fetch Data Latar Belakang
        async function loadData() {
            if (!GAS_API_URL) return;
            try {
                const response = await fetch(GAS_API_URL + "?action=getData");
                db = await response.json();
                processDataAndRender();
            } catch (error) {
                console.error("Fetch Error:", error);
                Toast.fire({ icon: 'error', title: 'Gagal mengambil data' });
            }
        }
        
        async function silentSync() {
            try {
                const response = await fetch(GAS_API_URL + "?action=getData");
                db = await response.json();
                processDataAndRender();
            } catch (e) { console.error("Silent sync failed"); }
        }

        function processDataAndRender() {
            renderDashboard();
            renderTable();
        }

        function renderDashboard() {
            let startFilter = document.getElementById('filterStart').value; 
            let endFilter = document.getElementById('filterEnd').value;
            let chartFilterType = document.getElementById('chartFilter').value;

            let filteredDb = db.filter(item => {
                if(!item.Tanggal) return false;
                let dateStr = item.Tanggal.substring(0, 7); 
                if (startFilter && dateStr < startFilter) return false;
                if (endFilter && dateStr > endFilter) return false;
                return true;
            });

            // Agregasi Data
            let monthlyData = {};
            filteredDb.forEach(item => {
                let nom = parseInt(item.Nominal) || 0;
                // Pengamanan zona waktu saat parse string
                let safeDate = item.Tanggal.length === 10 ? item.Tanggal + "T12:00:00" : item.Tanggal;
                let tglObj = new Date(safeDate);
                let monthKey = item.Tanggal.substring(0, 7);
                let monthName = tglObj.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
                
                if(!monthlyData[monthKey]) monthlyData[monthKey] = { name: monthName, kebutuhan: 0, masuk: 0, jmlDai: 0 };

                if(item.Tipe === 'Kebutuhan') {
                    monthlyData[monthKey].kebutuhan += nom;
                    monthlyData[monthKey].jmlDai += parseInt(item.Keterangan) || 0;
                } else if (item.Tipe === 'Pemasukan') {
                    monthlyData[monthKey].masuk += nom;
                }
            });

            const sortedKeys = Object.keys(monthlyData).sort();
            const tbody = document.getElementById('rekapTableBody');
            tbody.innerHTML = '';
            
            let totalK = 0; let totalM = 0; let totalSisa = 0;
            let chartLabels = []; let dataKebutuhan = []; let dataMasuk = []; let dataDai = [];

            sortedKeys.forEach((key, index) => {
                let d = monthlyData[key];
                // Sisa Kebutuhan = Kebutuhan - Masuk
                let sisa = d.kebutuhan - d.masuk;
                
                totalK += d.kebutuhan;
                totalM += d.masuk;
                totalSisa += sisa;

                // Logika Warna: Kebutuhan > Masuk (Merah), Pas (Biru), Surplus (Hijau). Tanpa tanda +/-
                let sisaBadge = '';
                if(sisa > 0) sisaBadge = `<span class="status-badge status-red">${formatRupiahText(sisa)}</span>`;
                else if (sisa === 0) sisaBadge = `<span class="status-badge status-blue">Rp 0</span>`;
                else sisaBadge = `<span class="status-badge status-green">${formatRupiahText(Math.abs(sisa))}</span>`;

                let tr = `
                    <tr>
                        <td class="text-muted fw-bold">${index + 1}</td>
                        <td class="fw-bolder text-main">${d.name.toUpperCase()}</td>
                        <td class="text-center fw-bold text-main">${d.jmlDai}</td>
                        <td class="text-end fw-bold text-danger">${formatRupiahText(d.kebutuhan)}</td>
                        <td class="text-end fw-bold text-primary">${formatRupiahText(d.masuk)}</td>
                        <td class="text-end">${sisaBadge}</td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', tr);

                chartLabels.push(new Date(key + '-01T12:00:00').toLocaleDateString('id-ID', { month: 'short', year: '2-digit' }));
                dataKebutuhan.push(d.kebutuhan);
                dataMasuk.push(d.masuk);
                dataDai.push(d.jmlDai);
            });

            if (sortedKeys.length === 0) tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-5 fw-bold">Belum ada data pada rentang waktu ini.</td></tr>';

            // Total Keseluruhan
            document.getElementById('totKebutuhan').innerText = formatRupiahText(totalK);
            document.getElementById('totMasuk').innerText = formatRupiahText(totalM);
            
            let totBadge = '';
            if(totalSisa > 0) totBadge = `<span class="status-badge status-red text-white">${formatRupiahText(totalSisa)}</span>`;
            else if (totalSisa === 0) totBadge = `<span class="status-badge status-blue text-white">Rp 0</span>`;
            else totBadge = `<span class="status-badge status-green text-white">${formatRupiahText(Math.abs(totalSisa))}</span>`;
            document.getElementById('totSisa').innerHTML = totBadge;

            // Render Chart
            let datasets = [];
            let chartStepSize = 50000000;
            let chartCallback = function(value) { return 'Rp ' + (value/1000000) + ' Jt'; };

            if(chartFilterType === 'all' || chartFilterType === 'kebutuhan') {
                datasets.push({ label: 'Kebutuhan Dana', data: dataKebutuhan, backgroundColor: 'rgba(239, 68, 68, 0.9)', borderRadius: 8, maxBarThickness: 45 });
            }
            if(chartFilterType === 'all' || chartFilterType === 'pemasukan') {
                datasets.push({ label: 'Dana Masuk', data: dataMasuk, backgroundColor: 'rgba(37, 99, 235, 0.9)', borderRadius: 8, maxBarThickness: 45 });
            }
            if(chartFilterType === 'dai') {
                datasets.push({ label: 'Jumlah Dai', data: dataDai, backgroundColor: 'rgba(16, 185, 129, 0.9)', borderRadius: 8, maxBarThickness: 45 });
                chartStepSize = 50; // Skala kelipatan 50 untuk Dai
                chartCallback = function(value) { return value; };
            }

            const ctx = document.getElementById('financeChart').getContext('2d');
            if(chartInstance) chartInstance.destroy(); 
            
            Chart.defaults.font.family = "'Plus Jakarta Sans', sans-serif";
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: { labels: chartLabels, datasets: datasets },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, font: {weight: 'bold'} } },
                        tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, cornerRadius: 10 }
                    },
                    scales: { 
                        x: { grid: { display: false } },
                        y: { 
                            beginAtZero: true, border: { display: false },
                            grid: { color: 'rgba(203, 213, 225, 0.4)' },
                            ticks: { stepSize: chartStepSize, callback: chartCallback, font: { weight: 'bold' } } 
                        } 
                    }
                }
            });
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let filteredData = [...db].sort((a, b) => new Date(b.Tanggal) - new Date(a.Tanggal));

            filteredData.forEach(item => {
                let badgeClass = item.Tipe === 'Pemasukan' ? 'bg-primary bg-opacity-10 text-primary' : 'bg-danger bg-opacity-10 text-danger';
                let linkBukti = item.Bukti_URL ? 
                    `<a href="${item.Bukti_URL}" target="_blank" class="btn btn-sm btn-light py-1 px-2 rounded-3 text-primary border"><i class="bi bi-image"></i> Lihat</a>` : 
                    '<span class="text-muted small">-</span>';
                
                // Mencegah tanggal mundur dgn T12:00:00
                let safeDate = item.Tanggal.length === 10 ? item.Tanggal + "T12:00:00" : item.Tanggal;
                let dObj = new Date(safeDate);
                
                let dateDisplay = item.Tipe === 'Kebutuhan' ? 
                    dObj.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }) : 
                    dObj.toLocaleDateString('id-ID', { day:'numeric', month: 'short', year: 'numeric' });
                let detailSuffix = item.Tipe === 'Kebutuhan' ? ' Dai' : '';

                let row = `
                    <tr>
                        <td class="text-nowrap text-muted fw-bold">${dateDisplay}</td>
                        <td><span class="badge ${badgeClass} border-0 rounded-pill px-3 py-2 fs-6">${item.Tipe}</span></td>
                        <td class="fw-bolder">${item.Keterangan}${detailSuffix}</td>
                        <td class="text-end fw-bolder text-main fs-6">${formatRupiahText(item.Nominal)}</td>
                        <td class="text-center">${linkBukti}</td>
                        <td class="text-center text-nowrap">
                            <button class="btn btn-sm btn-light border text-primary rounded-circle me-1" onclick="editAction('${item.ID}')"><i class="bi bi-pencil-fill"></i></button>
                            <button class="btn btn-sm btn-light border text-danger rounded-circle" onclick="deleteAction('${item.ID}')"><i class="bi bi-trash3-fill"></i></button>
                        </td>
                    </tr>
                `;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        // Sistem Proteksi Akses (Lajnah Password)
        async function authGuard() {
            if (isAuthenticated) return true;
            const { value: code } = await Swal.fire({
                title: 'Akses Terkunci', 
                input: 'password', 
                inputPlaceholder: 'Masukkan Kode Akses',
                html: '<small class="text-muted">Gunakan sandi <b>lajnah</b> untuk otorisasi.</small>',
                showCancelButton: true, confirmButtonText: 'Buka Akses', cancelButtonText: 'Batal',
                confirmButtonColor: '#2563EB', customClass: { popup: 'rounded-4' }
            });
            if (code === 'lajnah') {
                isAuthenticated = true; return true;
            } else if (code) {
                Swal.fire({title: 'Akses Ditolak', text: 'Kode sandi salah!', icon: 'error', confirmButtonColor: '#ef4444'});
            }
            return false;
        }

        async function trySwitchTab(tabId) {
            if (tabId === 'input' && !isAuthenticated) {
                const authed = await authGuard();
                if(!authed) return;
            }
            switchTabUI(tabId);
        }

        function switchTabUI(tabId) {
            document.querySelectorAll('.tab-content-area').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            if(document.getElementById('nav-' + tabId)) document.getElementById('nav-' + tabId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ACTION: HAPUS
        async function deleteAction(id) {
            if (!await authGuard()) return;
            
            Swal.fire({
                title: 'Hapus Transaksi?', text: "Tindakan ini tidak dapat dibatalkan.", icon: 'warning',
                showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'Ya, Hapus!'
            }).then((res) => {
                if(res.isConfirmed) {
                    // 1. Optimistic Delete (Langsung hilang di layar)
                    db = db.filter(x => x.ID !== id);
                    processDataAndRender();
                    Toast.fire({ icon: 'info', title: 'Menghapus data di server...' });

                    // 2. Background Sync
                    fetch(GAS_API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'delete', id: id }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    }).then(r => r.json()).then(res => {
                        if(res.status === 'success') {
                            Toast.fire({ icon: 'success', title: 'Data terhapus permanen.' });
                            silentSync(); 
                        } else { Toast.fire({ icon: 'error', title: 'Gagal dihapus.' }); silentSync(); }
                    });
                }
            });
        }

        // ACTION: EDIT
        async function editAction(id) {
            if (!await authGuard()) return;
            
            let item = db.find(x => x.ID === id);
            if(!item) return;
            
            editId = id;
            switchTabUI('input');
            document.getElementById('formTitle').innerText = "Edit Data Sistem";
            document.querySelectorAll('.btn-cancel').forEach(btn => btn.style.display = 'block');
            
            if(item.Tipe === 'Pemasukan') {
                new bootstrap.Tab(document.getElementById('tab-btn-masuk')).show();
                const form = document.getElementById('formPemasukan');
                form.tanggal.value = item.Tanggal.substring(0, 10);
                form.keterangan.value = item.Keterangan;
                form.nominal.value = formatRupiahText(item.Nominal);
                document.getElementById('editFileHintMasuk').classList.remove('d-none');
            } else if (item.Tipe === 'Kebutuhan') {
                new bootstrap.Tab(document.getElementById('tab-btn-kebutuhan')).show();
                const form = document.getElementById('formKebutuhan');
                form.tanggal.value = item.Tanggal.substring(0, 7);
                form.keterangan.value = item.Keterangan;
                form.nominal.value = formatRupiahText(item.Nominal);
            }
        }

        function cancelEdit() {
            editId = null;
            document.getElementById('formTitle').innerText = "Manajemen Data";
            document.querySelectorAll('.btn-cancel').forEach(btn => btn.style.display = 'none');
            document.getElementById('editFileHintMasuk').classList.add('d-none');
            document.getElementById('formPemasukan').reset();
            document.getElementById('formKebutuhan').reset();
            document.getElementById('formPemasukan').keterangan.value = 'WIZ';
            setDefaultDates();
        }

        // ACTION: SIMPAN (OPTIMISTIC UI)
        async function submitForm(e, tipe) {
            e.preventDefault();
            const form = e.target;
            const btn = form.querySelector('.btn-submit');
            
            const rawNominal = form.nominal.value.replace(/[^0-9]/g, '');
            if(!rawNominal || parseInt(rawNominal) <= 0) return Swal.fire('Error Input', 'Nominal harus berupa angka valid.', 'warning');
            
            let dateVal = form.tanggal.value;
            if(dateVal.length === 7) dateVal += "-01"; 

            let payload = {
                id: editId, tipe: tipe, tanggal: dateVal,
                nominal: parseInt(rawNominal), keterangan: form.keterangan.value,
                fileData: null, fileName: null
            };

            const fileInput = form.querySelector('input[type="file"]');
            if (fileInput && fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if(file.size > 2 * 1024 * 1024) return Swal.fire('File Kebesaran', 'Maks ukuran 2MB.', 'warning');
                Toast.fire({ icon: 'info', title: 'Mempersiapkan gambar...' });
                payload.fileData = await toBase64(file);
                payload.fileName = file.name;
            }

            btn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Menyimpan...`;
            btn.disabled = true;

            // 1. Optimistic Update (Tampilkan di UI langsung)
            let tempItem = { ...payload };
            if (!tempItem.id) tempItem.ID = "TEMP-" + Date.now(); 
            else tempItem.ID = tempItem.id;
            
            if (payload.fileData) tempItem.Bukti_URL = "Uploading...";
            
            if (editId) {
                let idx = db.findIndex(x => x.ID === editId);
                if(idx > -1) db[idx] = { ...db[idx], ...tempItem };
            } else {
                db.push(tempItem);
            }
            
            processDataAndRender();
            cancelEdit();
            Toast.fire({ icon: 'info', title: 'Menyimpan ke server latar belakang...' });

            // 2. Kirim Background API
            fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'save', data: payload }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            }).then(r => r.json()).then(res => {
                btn.disabled = false;
                btn.innerHTML = tipe === 'Pemasukan' ? "Simpan Dana Masuk" : "Simpan Kebutuhan Kafalah";
                
                if(res.status === 'success') {
                    Toast.fire({ icon: 'success', title: 'Data tersimpan.' });
                    silentSync(); // Tarik data valid dgn timestamp asli
                } else {
                    Toast.fire({ icon: 'error', title: 'Gagal Menyimpan' });
                    silentSync(); // Revert ke data asli jika gagal
                }
            }).catch(err => {
                btn.disabled = false;
                btn.innerHTML = tipe === 'Pemasukan' ? "Simpan Dana Masuk" : "Simpan Kebutuhan Kafalah";
                Toast.fire({ icon: 'error', title: 'Koneksi terputus.' });
                silentSync();
            });
        }

        // Helpers Utilities
        function formatCurrency(input) {
            let value = input.value.replace(/[^0-9]/g, '');
            input.value = value ? "Rp " + parseInt(value, 10).toLocaleString('id-ID') : "";
        }
        function formatRupiahText(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }
        function setDefaultDates() {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            document.querySelectorAll('input[type="date"]').forEach(el => el.value = `${yyyy}-${mm}-${dd}`);
            document.querySelectorAll('input[type="month"]:not(#filterStart):not(#filterEnd)').forEach(el => el.value = `${yyyy}-${mm}`);
        }
        const toBase64 = file => new Promise((res, rej) => { const r = new FileReader(); r.readAsDataURL(file); r.onload = () => res(r.result); r.onerror = e => rej(e); });

    </script>
</body>
</html>
